<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';font-weight:600;src:url('fraunces-latin-600-normal.woff2') format('woff2');}
body{margin:0}
.root{width:1080px;height:1350px;box-sizing:border-box;padding:88px;background:#F3EDE4;color:#3B2A22;font-family:'Inter',Arial,sans-serif;position:relative;overflow:hidden}
.selo{display:inline-block;background:#A55A41;color:#fff;font-weight:700;font-size:26px;letter-spacing:3px;padding:14px 28px;border-radius:999px}
h1{margin:36px 0 0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:76px;line-height:1.05;white-space:nowrap}
.foot{position:absolute;left:88px;right:88px;bottom:70px;display:flex;justify-content:space-between;font-size:26px;font-weight:500;color:#5A4336}
svg{position:absolute;left:0;top:0}
</style>
</head>
<body>
<div class="root">
  <span class="selo">DICA DA ARQUI</span>
  <h1>Quadro na altura certa</h1>
  <svg width="1080" height="1350" viewBox="0 0 1080 1350" aria-hidden="true">
    <!-- piso -->
    <line x1="88" y1="1180" x2="992" y2="1180" stroke="#3B2A22" stroke-width="4"/>
    <g stroke="#3B2A22" stroke-width="2" opacity="0.35">
      <line x1="110" y1="1180" x2="90" y2="1200"/><line x1="170" y1="1180" x2="150" y2="1200"/><line x1="230" y1="1180" x2="210" y2="1200"/><line x1="290" y1="1180" x2="270" y2="1200"/><line x1="350" y1="1180" x2="330" y2="1200"/><line x1="410" y1="1180" x2="390" y2="1200"/><line x1="470" y1="1180" x2="450" y2="1200"/><line x1="530" y1="1180" x2="510" y2="1200"/><line x1="590" y1="1180" x2="570" y2="1200"/><line x1="650" y1="1180" x2="630" y2="1200"/><line x1="710" y1="1180" x2="690" y2="1200"/><line x1="770" y1="1180" x2="750" y2="1200"/><line x1="830" y1="1180" x2="810" y2="1200"/><line x1="890" y1="1180" x2="870" y2="1200"/><line x1="950" y1="1180" x2="930" y2="1200"/>
    </g>
    <!-- sofá -->
    <rect x="180" y="874" width="720" height="150" rx="22" fill="#D6BFA6" stroke="#3B2A22" stroke-width="4"/>
    <rect x="150" y="960" width="780" height="170" rx="26" fill="#D6BFA6" stroke="#3B2A22" stroke-width="4"/>
    <line x1="540" y1="985" x2="540" y2="1130" stroke="#3B2A22" stroke-width="3" opacity="0.5"/>
    <rect x="190" y="1130" width="24" height="50" fill="#3B2A22"/><rect x="866" y="1130" width="24" height="50" fill="#3B2A22"/>
    <!-- quadro -->
    <rect x="300" y="496" width="480" height="288" fill="#FFFFFF" stroke="#3B2A22" stroke-width="10"/>
    <rect x="340" y="532" width="400" height="216" fill="#6F7C5E" opacity="0.85"/>
    <path d="M340 748 L470 640 L560 710 L640 620 L740 748 Z" fill="#A55A41" opacity="0.9"/>
    <circle cx="660" cy="585" r="22" fill="#F3EDE4" opacity="0.9"/>
    <!-- linha de centro -->
    <line x1="260" y1="640" x2="1000" y2="640" stroke="#A55A41" stroke-width="3" stroke-dasharray="14 10"/>
    <!-- cota 1,50 m -->
    <line x1="960" y1="640" x2="960" y2="1180" stroke="#A55A41" stroke-width="4"/>
    <line x1="940" y1="640" x2="980" y2="640" stroke="#A55A41" stroke-width="4"/>
    <line x1="940" y1="1180" x2="980" y2="1180" stroke="#A55A41" stroke-width="4"/>
    <!-- cota 20 a 30 cm -->
    <line x1="120" y1="784" x2="120" y2="874" stroke="#A55A41" stroke-width="4"/>
    <line x1="100" y1="784" x2="300" y2="784" stroke="#A55A41" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="100" y1="874" x2="180" y2="874" stroke="#A55A41" stroke-width="2" stroke-dasharray="8 8"/>
    <line x1="100" y1="784" x2="140" y2="784" stroke="#A55A41" stroke-width="4"/>
    <line x1="100" y1="874" x2="140" y2="874" stroke="#A55A41" stroke-width="4"/>
  </svg>
  <div style="position:absolute;left:792px;top:800px;width:150px;text-align:right;white-space:nowrap;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:46px;line-height:1;color:#A55A41">1,50 m</div>
    <div style="position:absolute;left:142px;top:810px;white-space:nowrap;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:34px;line-height:1;color:#A55A41">20 a 30 cm</div>
  <div style="position:absolute;left:88px;top:300px;right:88px;font-size:36px;line-height:1.35;color:#3B2A22">O centro fica a <b>1,50 m do chão</b>. Sobre o sofá, deixe <b style="white-space:nowrap">20 a 30 cm</b> de folga.</div>
  <div class="foot"><span>@confianaarquiteta</span><span>Beijo da Arqui</span></div>
</div>
</body>
</html>
