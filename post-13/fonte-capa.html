<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';font-weight:600;src:url('fraunces-latin-600-normal.woff2') format('woff2');}
body{margin:0}
.root{width:1080px;height:1350px;position:relative;overflow:hidden;font-family:'Inter',Arial,sans-serif;color:#fff}
.root img{position:absolute;left:0;top:-170px;width:1080px}
.grad{position:absolute;left:0;top:0;width:1080px;height:640px;background:linear-gradient(180deg,rgba(43,28,22,.78) 0%,rgba(43,28,22,.55) 45%,rgba(43,28,22,0) 100%)}
.selo{position:absolute;left:72px;top:64px;background:#A55A41;color:#fff;font-weight:700;font-size:26px;letter-spacing:3px;padding:14px 28px;border-radius:999px}
h1{position:absolute;left:72px;right:72px;top:142px;margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:84px;line-height:1.04;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.sub{position:absolute;left:72px;top:340px;font-size:32px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.credito{position:absolute;right:28px;bottom:22px;font-size:18px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.handle{position:absolute;left:28px;bottom:22px;font-size:20px;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.7)}
</style>
</head>
<body>
<div class="root">
  <img src="foto-tapete.png" alt="">
  <div class="grad"></div>
  <span class="selo">DICA DA ARQUI</span>
  <h1>O tapete precisa<br>“abraçar” o sofá</h1>
  <div class="sub">Arrasta pro lado e vê a cola com o tamanho certo →</div>
  <span class="handle">@confianaarquiteta</span>
  <span class="credito">Foto: Hayley Bagwell / Unsplash</span>
</div>
</body>
</html>
