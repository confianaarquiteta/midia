<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Fraunces';font-weight:600;src:url('fraunces-latin-600-normal.woff2') format('woff2');}
body{margin:0}
.root{width:1080px;height:1350px;position:relative;overflow:hidden;background:#A55A41;color:#fff;font-family:'Inter',Arial,sans-serif}
.arco{position:absolute;left:520px;top:330px;width:700px;height:1100px;border-radius:350px 350px 0 0;background:#B5654A;opacity:.55}
.bloco{position:absolute;left:88px;right:88px;bottom:88px;display:flex;flex-direction:column;gap:28px}
h1{margin:0;font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:108px;line-height:1.08}
p{margin:0;font-size:44px;line-height:1.35}
.b{font-weight:700}
.handle{font-size:26px;font-weight:500;margin-top:12px}
</style>
</head>
<body>
<div class="root">
  <div class="arco"></div>
  <div class="bloco">
    <h1>Seu tapete está certo?</h1>
    <p class="b">Envia para quem precisa<br>de um tapete na sala.</p>
    <span class="handle">@confianaarquiteta</span>
  </div>
</div>
</body>
</html>
